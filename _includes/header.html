<header class="site-header">
  <div class="header-top">
    <!-- زر البلد -->
    <div class="visitor-flag" id="visitorFlag">
      <img id="flagImg" src="https://flagcdn.com/w40/dz.png" alt="Flag" style="opacity: 0.5;">
      <span id="countryName">...</span>
    </div>

    <!-- زر اللغة -->
    <div class="lang-switcher">
      <button class="lang-btn" id="langBtn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="currentLang">العربية</span>
      </button>
      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-option active" data-lang="ar">العربية</button>
        <button class="lang-option" data-lang="en">English</button>
        <button class="lang-option" data-lang="fr">Français</button>
      </div>
    </div>
  </div>

  <!-- الصورة والاسم والنبذة -->
  <img src="https://github.com/nidalbenyakhelf.png?size=256" alt="Mohamed Nidhal Benyakhelf" class="avatar">
  <h1 class="site-name" data-i18n="name">Mohamed Nidhal Benyakhelf</h1>
  
  <a href="{{ site.social_links.github }}" class="username-badge">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
    @nidalbenyakhelf
  </a>
  
  <p class="bio" data-i18n="bio">مطور برمجيات وصانع أفلام وثائقية من المدية، الجزائر.</p>

  <!-- القائمة الرئيسية -->
  <nav class="main-nav">
    <ul>
      <li><a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}" data-i18n="nav_home">الرئيسية</a></li>
      <li class="dropdown" tabindex="0">
        <a href="#" class="nav-link {% if page.url contains '/projects/' or page.url contains '/filmmaking/' %}active{% endif %}" data-i18n="nav_projects">
          المشاريع
          <svg class="icon" style="width:16px;height:16px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </a>
        <div class="dropdown-content">
          <a href="/projects/" class="dropdown-item"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> البرمجيات</a>
          <a href="/filmmaking/" class="dropdown-item"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.4 1.3-2.9l13.8-5.1c1.1-.5 2.4.2 2.9 1.3Z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> الأفلام</a>

      <li><a href="/partners/" class="nav-link {% if page.url == '/partners/' %}active{% endif %}" data-i18n="nav_partners">الشركاء</a></li>
