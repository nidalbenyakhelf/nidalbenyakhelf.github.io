<header class="site-header">
  <div class="header-top">
    <!-- زر البلد: يظهر دائماً -->
    <div class="visitor-flag" id="visitorFlag">
      <img id="flagImg" src="https://flagcdn.com/w40/dz.png" alt="Flag" style="opacity: 0.5;"> <!-- علم افتراضي باهت -->
      <span id="countryName">...</span>
    </div>

    <!-- زر اللغة -->
    <div class="lang-switcher">
      <button class="lang-btn" id="langBtn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="currentLang">العربية</span>
      </button>
      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-option active" data-lang="ar">العربية</button>
        <button class="lang-option" data-lang="en">English</button>
        <button class="lang-option" data-lang="fr">Français</button>
      </div>
    </div>
  </div>

  <!-- باقي الهيدر كما هو... -->
